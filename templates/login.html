<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zynnos Central</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0f0d;--card:#111a14;--border:#1e2e21;--lime:#b8ff57;--fg:#e8f0e9;--muted:#6b8c72}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2.5rem;width:100%;max-width:360px}
  .logo{font-size:1.4rem;font-weight:700;color:var(--lime);margin-bottom:.25rem}
  .sub{color:var(--muted);font-size:.85rem;margin-bottom:2rem}
  label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:.4rem}
  input[type=password]{width:100%;background:#0d1710;border:1px solid var(--border);border-radius:8px;color:var(--fg);padding:.75rem 1rem;font-size:1rem;outline:none;transition:border .2s}
  input[type=password]:focus{border-color:var(--lime)}
  button{width:100%;margin-top:1.25rem;background:var(--lime);color:#0a1409;font-weight:700;font-size:.95rem;border:none;border-radius:8px;padding:.85rem;cursor:pointer;transition:opacity .2s}
  button:hover{opacity:.88}
  .error{color:#ff6b6b;font-size:.85rem;margin-top:.75rem;text-align:center}
</style>
</head>
<body>
<div class="card">
  <div class="logo">⚡ Zynnos Central</div>
  <div class="sub">Panel de operaciones</div>
  <form method="POST">
    <label for="pwd">Contraseña</label>
    <input type="password" id="pwd" name="password" autofocus placeholder="••••••••">
    <button type="submit">Entrar</button>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
  </form>
</div>
</body>
</html>
